<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>傻鱼</title>
<style>
:root{
  --bg:#0a0c12; --surface:rgba(255,255,255,.035); --surface-2:rgba(255,255,255,.055);
  --border:rgba(255,255,255,.07); --border-2:rgba(255,255,255,.12);
  --tx:#e8ecf6; --tx-2:#a3adc2; --sub:#6b7488;
  --acc:#8b7bf0; --ok:#34d399; --bad:#f87171;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);
  font-family:"Segoe UI Variable Display","Microsoft YaHei UI",system-ui;
  font-size:13px;-webkit-font-smoothing:antialiased}
svg{display:block;flex:none}
#app{display:flex;height:100%}
aside{width:68px;flex:none;display:flex;flex-direction:column;overflow:hidden;
  padding:20px 10px 14px;position:relative;
  background:linear-gradient(180deg,rgba(255,255,255,.028),rgba(255,255,255,0) 40%);
  border-right:1px solid var(--border);
  transition:width .22s cubic-bezier(.4,0,.2,1)}
aside.wide{width:200px}
#pin{margin-top:auto;flex:none;align-self:center;
  width:44px;height:32px;border:1px solid var(--border);border-radius:9px;
  background:rgba(255,255,255,.06);color:#9aa3b8;cursor:pointer;
  display:grid;place-items:center;transition:all .2s}
#pin:hover{background:rgba(255,255,255,.13);color:#fff;border-color:var(--border-2)}
#pin svg{width:15px;height:15px;stroke:currentColor;stroke-width:2.2;fill:none;
  stroke-linecap:round;stroke-linejoin:round;transition:transform .25s}
aside.wide #pin{align-self:flex-end;width:30px;height:30px;border-radius:7px}
aside.wide #pin svg{transform:rotate(180deg)}
.brand{display:flex;align-items:center;gap:10px;padding:0 0 18px;justify-content:center}
aside.wide .brand{justify-content:flex-start;padding-left:6px}
.logo{width:32px;height:32px;border-radius:9px;flex:none;display:grid;place-items:center;
  font-size:16px;background:linear-gradient(135deg,#8b7bf0,#5b4bd6 60%,#3d2fa8);
  box-shadow:0 4px 14px rgba(124,106,220,.4),inset 0 1px 0 rgba(255,255,255,.25)}
.brand-txt{display:none;white-space:nowrap}
aside.wide .brand-txt{display:block}
.brand-txt h1{font-size:14.5px;font-weight:650;line-height:1.1}
.brand-txt span{display:block;font-size:9.5px;color:var(--sub);letter-spacing:1.7px;
  font-weight:500;margin-top:3px}
.side-scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;
  display:flex;flex-direction:column;scrollbar-width:none}
.side-scroll::-webkit-scrollbar{width:0;height:0}
.nav{display:flex;flex-direction:column;gap:2px;flex:none}
aside:not(.wide) .nav-item,
aside:not(.wide) .btn{display:grid;place-items:center;padding:0;gap:0}
aside:not(.wide) .nav-item svg,
aside:not(.wide) .btn svg{margin:0;width:18px;height:18px}
.nav-item{display:flex;align-items:center;gap:11px;height:38px;padding:0;justify-content:center;
  border-radius:9px;color:var(--tx-2);cursor:pointer;font-size:12.5px;
  transition:background .15s,color .15s;position:relative;white-space:nowrap}
aside.wide .nav-item{padding:0 11px;justify-content:flex-start}
.nav-item svg{width:17px;height:17px;stroke:currentColor;stroke-width:1.7;fill:none;
  stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.nav-item:hover{background:var(--surface);color:var(--tx)}
.nav-item.on{background:var(--surface-2);color:#fff;font-weight:600}
.nav-item.on svg{stroke:#c4b8ff}
.nav-item.on::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:2.5px;height:15px;border-radius:2px;background:linear-gradient(180deg,#a99bff,#6d5ae0);
  box-shadow:0 0 10px rgba(139,123,240,.85)}
.txt{display:none;white-space:nowrap}
aside.wide .txt{display:inline}
.divider{height:1px;background:var(--border);margin:14px 6px}
.ops{display:flex;flex-direction:column;gap:5px}
.ops-label{display:none;font-size:10px;color:var(--sub);letter-spacing:1.4px;
  font-weight:600;padding:0 8px 6px;white-space:nowrap}
aside.wide .ops-label{display:block}
.btn{display:flex;align-items:center;gap:9px;height:36px;padding:0;justify-content:center;
  border:1px solid var(--border);border-radius:9px;background:var(--surface);
  color:var(--tx-2);font-family:inherit;font-size:12px;cursor:pointer;
  transition:all .15s ease;white-space:nowrap}
aside.wide .btn{padding:0 11px;justify-content:flex-start}
.btn svg{width:15px;height:15px;stroke:currentColor;stroke-width:1.75;fill:none;
  stroke-linecap:round;stroke-linejoin:round;opacity:.95}
.btn:hover{background:var(--surface-2);border-color:var(--border-2);color:#fff}
aside.wide .btn:hover{transform:translateX(2px)}
.btn.primary{background:linear-gradient(135deg,#8b7bf0,#6d5ae0 55%,#5b48c8);
  border-color:transparent;color:#fff;font-weight:600;
  box-shadow:0 4px 16px rgba(109,90,224,.35),inset 0 1px 0 rgba(255,255,255,.18)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger:hover{border-color:rgba(248,113,113,.35);background:rgba(248,113,113,.09);color:#ffa8a8}
.grow{flex:1}
.foot{display:none;padding:0 8px 8px;font-size:10px;color:#4a5266;line-height:1.7;
  white-space:nowrap}
aside.wide .foot{display:block}
main{flex:1;display:flex;flex-direction:column;min-width:0;background:#070910}
.topbar{height:56px;flex:none;display:flex;align-items:center;gap:8px;padding:0 18px;
  border-bottom:1px solid var(--border);
  background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,0))}
.pill{display:flex;align-items:center;gap:8px;height:28px;padding:0 12px;border-radius:999px;
  background:var(--surface);border:1px solid var(--border);font-size:11.5px;color:var(--sub);
  transition:all .25s}
.pill[title]{cursor:pointer}
.pill[title]:hover{border-color:var(--border-2);background:rgba(255,255,255,.06)}
.pill .led{width:6px;height:6px;border-radius:50%;background:#39404f;flex:none;transition:all .25s}
.pill b{color:var(--tx-2);font-weight:600;font-size:11.5px}
.pill.up{border-color:rgba(52,211,153,.22);background:rgba(52,211,153,.06)}
.pill.up .led{background:var(--ok);box-shadow:0 0 8px var(--ok);animation:pulse 2.4s infinite}
.pill.up b{color:#9df3cd}
.pill.down{border-color:rgba(248,113,113,.22);background:rgba(248,113,113,.06)}
.pill.down .led{background:var(--bad);box-shadow:0 0 8px rgba(248,113,113,.7)}
.pill.down b{color:#ffb4b4}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.spacer{flex:1}
.clock{font-size:11.5px;color:var(--sub);font-variant-numeric:tabular-nums;letter-spacing:.5px}
.icon-btn{width:28px;height:28px;border-radius:8px;border:1px solid var(--border);
  background:var(--surface);color:var(--tx-2);cursor:pointer;display:grid;place-items:center;
  transition:all .15s}
.icon-btn svg{width:14px;height:14px;stroke:currentColor;stroke-width:1.7;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
.icon-btn:hover{background:var(--surface-2);color:#fff;border-color:var(--border-2)}
.icon-btn.spin svg{animation:spin .7s linear}
@keyframes spin{to{transform:rotate(360deg)}}
.stage{flex:1;position:relative;overflow:hidden}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;opacity:0;transition:opacity .28s}
iframe.ready{opacity:1}
#veil{position:absolute;inset:0;display:grid;place-items:center;background:#070910;
  transition:opacity .3s;z-index:2}
#veil.gone{opacity:0;pointer-events:none}
.loader{display:flex;flex-direction:column;align-items:center;gap:14px}
.ring{width:26px;height:26px;border-radius:50%;border:2px solid rgba(139,123,240,.18);
  border-top-color:#8b7bf0;animation:spin .8s linear infinite}
.loader span{font-size:11px;color:var(--sub);letter-spacing:2px}
/* ── 版本更新条 ── */
.ver-bar{display:none;align-items:center;gap:12px;padding:9px 18px;font-size:12px;
  border-bottom:1px solid var(--border);flex-wrap:wrap}
.ver-bar.ok{background:rgba(52,211,153,.06);color:#9df3cd}
.ver-bar.new{background:rgba(139,123,240,.1);color:#c4b8ff}
.ver-bar b{font-size:13px}
.ver-bar i{font-style:normal;color:var(--sub);margin-left:6px;font-size:11px}
.ver-bar em{font-style:normal;color:var(--sub);font-size:11px;flex:1}
.ver-bar a{color:#fff;text-decoration:none;background:var(--acc);padding:5px 14px;
  border-radius:7px;font-size:11.5px;font-weight:600}
.ver-bar a:hover{filter:brightness(1.1)}

/* ── 插件市场 ── */
.mk-bar{display:flex;gap:10px;align-items:center;padding:12px 18px;
  border-bottom:1px solid var(--border);background:rgba(11,14,21,.94);
  backdrop-filter:blur(8px);flex-wrap:wrap;
  position:sticky;top:0;z-index:5}   /* 列表长的时候，搜索框和上传按钮别跟着滚走 */
.mk-tabs{display:flex;gap:2px;background:rgba(255,255,255,.04);border-radius:9px;padding:3px}
.mk-tabs button{height:26px;padding:0 14px;border:0;border-radius:7px;background:transparent;
  color:var(--sub);font-family:inherit;font-size:12px;cursor:pointer;transition:.15s}
.mk-tabs button.on{background:var(--acc);color:#fff;font-weight:600}
.mk-search{flex:1;min-width:180px;height:32px;padding:0 12px;border-radius:8px;
  background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--tx);
  font-family:inherit;font-size:12px;outline:none}
.mk-search:focus{border-color:var(--acc)}
.mk-tags{display:flex;gap:6px;flex-wrap:wrap;padding:10px 18px 0}
.mk-tag{font-size:11px;padding:3px 10px;border-radius:20px;cursor:pointer;
  background:rgba(255,255,255,.05);color:var(--sub);border:1px solid transparent;transition:.15s}
.mk-tag:hover{color:#fff}
.mk-tag.on{background:rgba(139,123,240,.2);color:#c4b8ff;border-color:rgba(139,123,240,.4)}
.mk-tip{font-size:11px;color:var(--warn);padding:8px 18px 0}
.mk-list{padding:10px 18px 30px}
.mk-actions{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.mk-btn{height:26px;padding:0 12px;border-radius:7px;border:1px solid var(--border);
  background:rgba(255,255,255,.05);color:var(--tx-2);font-family:inherit;font-size:11.5px;
  cursor:pointer;transition:.15s;white-space:nowrap}
.mk-btn:hover{background:rgba(255,255,255,.1);color:#fff}
.mk-btn.primary{background:linear-gradient(135deg,#8b7bf0,#6d5ae0);border:0;color:#fff;font-weight:600}
.mk-btn.danger:hover{border-color:rgba(248,113,113,.4);color:#ffa8a8;background:rgba(248,113,113,.08)}
.pl-badge.warn{background:rgba(251,191,36,.18);color:#fbbf24}
.pl-badge.local{background:rgba(52,211,153,.16);color:#9df3cd}
/* ── 上传插件：拖到市场页时给个明确的落点 ── */
.mk-upload{height:30px;padding:0 16px;font-size:11.5px;flex:none}
.mk-drop{position:absolute;inset:10px;border:2px dashed rgba(139,123,240,.6);border-radius:16px;
  background:rgba(139,123,240,.1);display:none;place-items:center;text-align:center;
  font-size:14px;color:#c4b8ff;line-height:2;z-index:9;pointer-events:none;
  backdrop-filter:blur(2px)}
.mk-drop small{font-size:11.5px;color:#8f9bd0}
#pluginpage.dragover .mk-drop{display:grid}

#pluginpage{position:absolute;inset:0;display:none;flex-direction:column;background:#0b0e15;z-index:3}
#pluginpage.on{display:flex}
#pluginbody{flex:1;overflow:auto;padding:6px 18px 30px}
.pl-group-title{font-size:11px;color:var(--sub);letter-spacing:1.4px;font-weight:600;
  margin:18px 0 8px;text-transform:uppercase}
.pl-tip{font-size:11px;color:#4d5568;margin:-4px 0 10px}
.pl-card{display:flex;gap:14px;padding:14px 16px;border:1px solid var(--border);
  border-radius:12px;background:rgba(255,255,255,.022);margin-bottom:9px;
  transition:all .18s;align-items:flex-start}
.pl-card:hover{border-color:var(--border-2);background:rgba(255,255,255,.038)}
.pl-card.on{border-color:rgba(109,90,224,.35);background:rgba(109,90,224,.055)}
.pl-card.core{border-color:rgba(52,211,153,.3);background:rgba(52,211,153,.05)}
.pl-ico{width:38px;height:38px;flex:none;border-radius:10px;display:grid;place-items:center;
  font-size:19px;background:rgba(255,255,255,.055)}
.pl-main{flex:1;min-width:0}
.pl-head{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.pl-name{font-size:13.5px;font-weight:600;color:var(--tx)}
.pl-badge{font-size:9.5px;padding:1px 7px;border-radius:8px;letter-spacing:.4px;
  background:rgba(255,255,255,.08);color:var(--tx-2)}
.pl-badge.bot{background:rgba(139,123,240,.18);color:#c4b8ff}
.pl-badge.local{background:rgba(52,211,153,.16);color:#9df3cd}
.pl-desc{font-size:12px;color:var(--tx-2);margin-top:5px;line-height:1.5}
.pl-detail{font-size:11px;color:var(--sub);margin-top:4px;line-height:1.6}
.pl-warn{font-size:11px;color:#fbbf24;margin-top:6px}
.pl-hint{font-size:11px;color:#4d5568;margin-top:5px;font-style:italic}
.pl-side{flex:none;padding-top:4px}
.pl-on-tag{font-size:11px;color:#9df3cd;font-weight:600}
#cfgpage{position:absolute;inset:0;display:none;flex-direction:column;background:#0b0e15;z-index:3}
#cfgpage.on{display:flex}
.cfg-top{flex:none;display:flex;gap:10px;align-items:center;padding:12px 18px;
  border-bottom:1px solid var(--border);background:rgba(255,255,255,.015)}
#cfgtabs{display:flex;gap:5px;flex-wrap:wrap;flex:1}
.g-tab{display:flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:8px;
  background:var(--surface);border:1px solid var(--border);font-size:11.5px;color:var(--tx-2);
  cursor:pointer;transition:all .15s}
.g-tab i{font-style:normal;font-size:9.5px;color:var(--sub);background:rgba(255,255,255,.06);
  border-radius:8px;padding:1px 5px}
.g-tab:hover{border-color:var(--border-2);color:#fff}
.g-tab.on{background:linear-gradient(135deg,#8b7bf0,#6d5ae0);border-color:transparent;
  color:#fff;font-weight:600}
.g-tab.on i{background:rgba(255,255,255,.22);color:#fff}
.save-btn{height:30px;padding:0 18px;border:0;border-radius:8px;flex:none;
  background:linear-gradient(135deg,#8b7bf0,#6d5ae0);color:#fff;font-size:12px;font-weight:600;
  font-family:inherit;cursor:pointer;box-shadow:0 4px 14px rgba(109,90,224,.32)}
.save-btn:hover{filter:brightness(1.08)}
#cfgbody{flex:1;overflow:auto;padding:8px 18px 24px}
/* 参数页底部：卸载（不往桌面丢快捷方式） */
.cfg-foot{flex:none;display:flex;align-items:center;gap:14px;padding:11px 18px;
  border-top:1px solid rgba(248,113,113,.22);background:rgba(248,113,113,.045)}
.cfg-foot-txt{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.cfg-foot-txt b{font-size:12.5px;color:#ffb4b4;font-weight:600}
.cfg-foot-txt span{font-size:11px;color:var(--sub);line-height:1.5}
.danger-btn{flex:none;height:30px;padding:0 16px;border-radius:8px;font-size:12px;
  border:1px solid rgba(248,113,113,.42);background:rgba(248,113,113,.12);
  color:#ffb4b4;font-family:inherit;cursor:pointer;transition:.15s}
.danger-btn:hover{background:rgba(248,113,113,.22);color:#fff;border-color:rgba(248,113,113,.7)}
.cfg-row{padding:13px 0;border-bottom:1px solid rgba(255,255,255,.045)}
.cfg-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.cfg-name{font-size:12.5px;color:var(--tx);font-weight:500}
.cfg-desc{font-size:11px;color:var(--sub);margin-top:3px;line-height:1.5}
.cfg-key{font-family:Consolas,monospace;font-size:10px;color:#4d5568;flex:none;padding-top:2px}
.cfg-ctl{margin-top:8px}
.inp{width:100%;max-width:520px;height:32px;padding:0 11px;border-radius:8px;
  background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--tx);
  font-family:inherit;font-size:12px;outline:none;transition:border-color .15s}
.inp:focus{border-color:var(--acc);background:rgba(255,255,255,.06)}
.inp.ta{height:auto;min-height:120px;padding:10px 11px;line-height:1.65;resize:vertical}
.cfg-empty{padding:40px;text-align:center;color:var(--sub);font-size:12px}
.sw{position:relative;display:inline-block;width:42px;height:23px;cursor:pointer}
.sw input{opacity:0;width:0;height:0}
.sw i{position:absolute;inset:0;background:#2a3042;border-radius:12px;transition:.2s}
.sw i:before{content:"";position:absolute;width:17px;height:17px;left:3px;top:3px;
  background:#8b93ad;border-radius:50%;transition:.2s}
.sw input:checked+i{background:rgba(109,90,224,.55)}
.sw input:checked+i:before{transform:translateX(19px);background:#b9aaff}
/* ── 安装向导 ── */
#setup{position:fixed;inset:0;z-index:99;display:none;place-items:center;
  background:radial-gradient(ellipse at 50% 0%,#141a2c 0%,#080a11 60%)}
#setup.on{display:grid}
#setupBox{width:520px;max-width:92vw;background:#12151f;border:1px solid var(--border);
  border-radius:18px;padding:34px 38px 28px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.setup-head{text-align:center;margin-bottom:26px}
.setup-logo{width:56px;height:56px;margin:0 auto 14px;border-radius:16px;display:grid;
  place-items:center;font-size:28px;
  background:linear-gradient(135deg,#8b7bf0,#5b4bd6 60%,#3d2fa8);
  box-shadow:0 8px 26px rgba(124,106,220,.45),inset 0 1px 0 rgba(255,255,255,.25)}
.setup-head h2{font-size:19px;font-weight:650;margin-bottom:6px}
.setup-head p{font-size:12.5px;color:var(--sub)}
.setup-dots{display:flex;gap:7px;justify-content:center;margin-top:14px}
.sd{width:7px;height:7px;border-radius:50%;background:#2a3042;transition:.25s}
.sd.on{background:#8b7bf0;box-shadow:0 0 10px rgba(139,123,240,.8);width:20px;border-radius:4px}
.sd.done{background:#4a5272}
.sf-label{display:block;font-size:12px;color:var(--tx-2);margin-bottom:7px;font-weight:500}
.sf-inp{width:100%;height:40px;padding:0 14px;border-radius:10px;
  background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--tx);
  font-family:Consolas,monospace;font-size:13px;outline:none;transition:border-color .15s}
.sf-inp:focus{border-color:var(--acc);background:rgba(255,255,255,.07)}
.sf-hint{font-size:11px;color:var(--sub);margin-top:9px;line-height:1.7}
.sf-row{display:flex;align-items:center;gap:12px;margin-top:14px}
.sf-msg{font-size:11.5px;color:var(--sub)}
.sf-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:26px}
.sf-btn{height:38px;padding:0 26px;border:0;border-radius:10px;cursor:pointer;
  background:linear-gradient(135deg,#8b7bf0,#6d5ae0);color:#fff;font-size:13px;
  font-weight:600;font-family:inherit;box-shadow:0 6px 18px rgba(109,90,224,.35)}
.sf-btn:hover{filter:brightness(1.1)}
.sf-btn.ghost{background:rgba(255,255,255,.06);color:var(--tx-2);box-shadow:none;
  border:1px solid var(--border)}
.sf-btn.ghost:hover{background:rgba(255,255,255,.11);color:#fff}
.sf-plugins{max-height:270px;overflow:auto;display:flex;flex-direction:column;gap:7px}
.sf-pl{display:flex;gap:11px;align-items:flex-start;padding:11px 13px;border-radius:10px;
  background:rgba(255,255,255,.03);border:1px solid var(--border);cursor:pointer;
  transition:.15s}
.sf-pl:hover{background:rgba(255,255,255,.06)}
.sf-pl input{margin-top:2px;accent-color:#8b7bf0;width:15px;height:15px;cursor:pointer}
.sf-pl-name{font-size:12.5px;font-weight:600;color:var(--tx)}
.sf-pl-cmd{font-size:10.5px;color:var(--sub);margin-top:3px;font-family:Consolas,monospace}
.sf-empty{padding:26px;text-align:center;color:var(--sub);font-size:12px}
.sf-done{text-align:center;padding:10px 0 4px}
.sf-check{width:56px;height:56px;margin:0 auto 16px;border-radius:50%;display:grid;
  place-items:center;font-size:26px;color:#0a0c12;background:linear-gradient(135deg,#34d399,#22b07d);
  box-shadow:0 8px 24px rgba(52,211,153,.4)}
.sf-done h3{font-size:16px;margin-bottom:8px}
.sf-done p{font-size:12px;color:var(--sub);line-height:1.7}

.statusbar{height:28px;flex:none;display:flex;align-items:center;gap:14px;padding:0 18px;
  border-top:1px solid var(--border);background:rgba(255,255,255,.015);
  font-size:11px;color:var(--sub)}
.statusbar .dot{width:5px;height:5px;border-radius:50%;background:var(--ok);
  box-shadow:0 0 7px var(--ok);flex:none}
.statusbar .model{color:var(--tx-2)}
</style>
</head>
<body>
<div id="app">
  <aside>
    <div class="brand">
      <div class="logo">🐟</div>
      <div class="brand-txt"><h1>傻鱼</h1><span>SHA YU</span></div>
    </div>
    <div class="side-scroll">
    <div class="nav">
      <div class="nav-item on" data-view="brain" title="大脑宇宙">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/>
          <ellipse cx="12" cy="12" rx="10" ry="4.2"/>
          <ellipse cx="12" cy="12" rx="10" ry="4.2" transform="rotate(60 12 12)"/>
          <ellipse cx="12" cy="12" rx="10" ry="4.2" transform="rotate(120 12 12)"/></svg>
        <span class="txt">大脑宇宙</span>
      </div>
      <div class="nav-item" data-view="config" title="参数设置">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/>
          <path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.2 5.2l2.1 2.1M16.7 16.7l2.1 2.1M18.8 5.2l-2.1 2.1M7.3 16.7l-2.1 2.1"/></svg>
        <span class="txt">参数设置</span>
      </div>
      <div class="nav-item" data-view="plugins" title="插件市场">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.6"/>
          <rect x="14" y="3" width="7" height="7" rx="1.6"/>
          <rect x="3" y="14" width="7" height="7" rx="1.6"/>
          <path d="M17.5 14v3.5H14M17.5 21v-3.5"/></svg>
        <span class="txt">插件市场</span>
      </div>
      <div class="nav-item" data-view="panel" title="管理面板">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/>
          <path d="M3 9h18M9 9v11"/></svg>
        <span class="txt">管理面板</span>
      </div>
      <div class="nav-item" data-view="voice" title="语音合成">
        <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/>
          <path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
        <span class="txt">语音合成</span>
      </div>
      <div class="nav-item" data-view="guide" title="使用教程">
        <svg viewBox="0 0 24 24"><path d="M5 4h9l5 5v11a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 20z"/>
          <path d="M14 4v5h5M8 13h8M8 17h5"/></svg>
        <span class="txt">运行日志</span>
      </div>
  <div class="nav-item" data-view="log" title="运行日志">
        <svg viewBox="0 0 24 24"><path d="M5 4h9l5 5v11a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 20z"/>
          <path d="M14 4v5h5M8 13h8M8 17h5"/></svg>
        <span class="txt">运行日志</span>
      </div>
    </div>
    <div class="divider"></div>
    <div class="ops">
      <div class="ops-label">翻唱</div>
      <button class="btn primary" data-act="start_sing" title="启动翻唱">
        <svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg>
        <span class="txt">启动翻唱</span>
      </button>
      <button class="btn danger" data-act="stop_sing" title="停止翻唱">
        <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        <span class="txt">停止翻唱</span>
      </button>
    </div>
    <div class="divider"></div>
    <div class="ops">
      <div class="ops-label">她</div>
      <button class="btn" data-act="wake" title="叫醒傻鱼">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/>
          <path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/></svg>
        <span class="txt">叫醒傻鱼</span>
      </button>
      <button class="btn" data-act="restart_cloud" title="重启云端 bot">
        <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 5v6h-6"/></svg>
        <span class="txt">重启云端</span>
      </button>
    </div>
    </div>
    <div class="foot">v1.0 · WebView2</div>
<button id="pin" title="展开 / 收起侧栏">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </aside>
  <main>
    <div class="topbar">
      <div class="pill" id="p-sing"><span class="led"></span>翻唱 <b>—</b></div>
      <div class="pill" id="p-snow"><span class="led"></span>SnowLuma <b>—</b></div>
      <div class="pill" id="p-tun" title="点一下重连隧道"><span class="led"></span>隧道 <b>—</b></div>
      <div class="pill" id="p-cloud" title="点一下重启云端"><span class="led"></span>云端 <b>—</b></div>
      <div class="spacer"></div>
      <div class="clock" id="clock"></div>
      <button class="icon-btn" id="refresh" title="刷新">
        <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 5v6h-6"/></svg>
      </button>
    </div>
    <div class="stage">
      <div id="pluginpage">
        <div class="ver-bar" id="verBar"></div>
        <div class="mk-bar" id="mkbar"></div>
        <div id="pluginbody" style="flex:1;overflow:auto"></div>
        <div class="mk-drop"><div>松手就装<br><small>把 .py 文件拖到这里，或者点右上角「上传插件」</small></div></div>
      </div>
      <div id="cfgpage">
        <div class="cfg-top">
          <div id="cfgtabs"></div>
          <button class="save-btn" onclick="saveConfig()">保存</button>
        </div>
        <div id="cfgbody"></div>
        <div class="cfg-foot">
          <div class="cfg-foot-txt">
            <b>卸载傻鱼</b>
            <span>停掉机器人，删掉整个安装目录 —— 记忆、配置、插件一起没，删完回不来</span>
          </div>
          <button class="danger-btn" onclick="askUninstall()">卸载</button>
        </div>
      </div>
      <iframe id="view" src="about:blank"></iframe>
      <div id="veil"><div class="loader"><div class="ring"></div><span>正在连接</span></div></div>
    </div>
    <div class="statusbar">
      <span class="dot"></span>
      <span id="msg">就绪</span>
      <div class="spacer"></div>
      <span class="model" id="model"></span>
    </div>
  </main>
</div>
<div id="setup"><div id="setupBox"><div id="setupBody"></div></div></div>

<script src="config.js?v=4"></script>
<script src="version.js?v=3"></script>
<script src="plugins.js?v=17"></script>
<script src="setup.js?v=2"></script>
<script>
// 面板地址以 settings.json 的 panelUrl 为准（安装器写的是实际端口），拿不到才用默认
let PANEL = "http://127.0.0.1:6200";
const URLS = { brain: "", panel: "", log: "" };
function applyPanel(u) {
  const nv = String(u || "").trim().replace(/\/+$/, "");
  const changed = !!nv && nv !== PANEL;
  if (nv) PANEL = nv;
  URLS.brain = PANEL + "/brain?compact=1";
  URLS.panel = PANEL + "/";
  URLS.log = PANEL + "/";
  URLS.guide = PANEL + "/guide?compact=1";
  URLS.voice = PANEL + "/tts";
  return changed;
}
applyPanel(PANEL);
const view = document.getElementById("view");
const veil = document.getElementById("veil");
const msg = document.getElementById("msg");
const clock = document.getElementById("clock");
const cfgPage = document.getElementById("cfgpage");
let cur = "brain";
let SETTINGS = null, BOT_FEATURES = {};

document.querySelectorAll(".nav-item").forEach(el => {
  el.onclick = () => {
    document.querySelectorAll(".nav-item").forEach(x => x.classList.remove("on"));
    el.classList.add("on");
    cur = el.dataset.view;
    load(true);
  };
});
function setMsg(t) { msg.textContent = t; }

function load(fade) {
  if (cur === "plugins") {
    view.style.display = "none";
    veil.classList.add("gone");
    cfgPage.classList.remove("on");
    document.getElementById("pluginpage").classList.add("on");
    document.querySelector(".mk-bar").innerHTML = "";   // 渲染交给 renderMarket
    openMarket().then(checkAppVersion);
    return;
  }
  document.getElementById("pluginpage").classList.remove("on");
  if (cur === "config") {
    view.style.display = "none";
    veil.classList.add("gone");
    cfgPage.classList.add("on");
    if (!CFG) loadConfig().then(ok => ok ? renderConfig() : setMsg("参数读取失败，检查 6200"));
    else renderConfig();
    return;
  }
  cfgPage.classList.remove("on");
  view.style.display = "";
  const u = URLS[cur];
  if (!u) return;
  if (fade) { view.classList.remove("ready"); veil.classList.remove("gone"); }
  view.src = u + (u.includes("?") ? "&" : "?") + "t=" + Date.now();
  view.onload = () => { view.classList.add("ready"); veil.classList.add("gone"); };
  setTimeout(() => { view.classList.add("ready"); veil.classList.add("gone"); }, 3500);
}

document.getElementById("refresh").onclick = e => {
  const b = e.currentTarget;
  b.classList.add("spin");
  setTimeout(() => b.classList.remove("spin"), 700);
  if (cur === "config") { CFG = null; load(true); } else load(true);
};
document.getElementById("pin").onclick = e => {
  const a = document.querySelector("aside");
  a.classList.toggle("wide");
  e.currentTarget.title = a.classList.contains("wide") ? "收起侧栏" : "展开侧栏";
};
document.getElementById("p-snow").onclick = () => {
  // 协议端的扫码/登录页在它自己的 WebUI 上
  post({ cmd: "act", act: "open_snowwebui" });
  setMsg("正在打开 QQ 登录页 …");
};
document.getElementById("p-tun").onclick = () => {
  post({ cmd: "act", act: "start_tunnel" });
  setMsg("正在重连隧道 …");
};
document.getElementById("p-cloud").onclick = () => {
  post({ cmd: "act", act: "restart_cloud" });
  setMsg("正在重启云端 …");
};
document.querySelectorAll(".btn").forEach(b => {
  b.onclick = () => {
    post({ cmd: "act", act: b.dataset.act });
    setMsg(b.title + " …");
  };
});
function post(o) { if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage(o); }
// 卸载：确认框在主程序里弹（这里只发请求）
function askUninstall() { post({ cmd: "uninstall" }); }
function pill(id, up, text) {
  const el = document.getElementById("p-" + id);
  if (!el) return;
  el.classList.toggle("up", !!up);
  el.classList.toggle("down", !up);
  el.querySelector("b").textContent = text;
}
async function loadPlugins() {
  post({ cmd: "getSettings" });
  await loadBotFeatures();
  renderPlugins();
}

if (window.chrome && window.chrome.webview) {
  window.chrome.webview.addEventListener("message", e => {
    const d = e.data;
    if (d.type === "settings") {
      SETTINGS = d.settings || {};
      // 面板端口可能不是 6200（被占/装的时候选过别的），一切 fetch 都跟着它走
      const moved = applyPanel(SETTINGS.panelUrl);
      // settings 比 900ms 的定时器到得晚，可能已经误弹了向导 —— 这里主动关掉
      if (SETTINGS.setupDone === true) {
        document.getElementById("setup").classList.remove("on");
      }
      if (moved && (cur === "brain" || cur === "panel" || cur === "log")) load();
      if (cur === "plugins") renderMarket();
      return;
    }
    if (d.type === "pluginsChanged") {
      if (cur === "plugins") openMarket(true);   // 主程序上传完插件，市场页静默刷新
      return;
    }
    if (d.type !== "status") return;
    pill("sing", d.sing, d.sing ? "运行中" : "已停");
    pill("snow", d.snow, d.snow ? "在线" : "已停");
    pill("tun", d.tun, d.tun ? "通" : "断");
    pill("cloud", d.cloud, d.cloud ? "在线" : "离线");
    if (d.model) document.getElementById("model").textContent = d.model;
    if (d.msg) setMsg(d.msg);
  });
}
setInterval(() => {
  clock.textContent = new Date().toLocaleTimeString("zh-CN", { hour12: false });
}, 1000);
clock.textContent = new Date().toLocaleTimeString("zh-CN", { hour12: false });
// 由 C# 通过 URL 参数决定（?setup=1 才进引导）
if (location.search.indexOf("setup=1") >= 0) {
  window.addEventListener("load", () => setTimeout(showSetup, 300));
}

// ══════════════════════════════════════════════════════
// PLUGIN_UI_1106：插件可以往面板里塞界面
//   插件返回 html / css / js，这里负责注入并给它一个安全的小 API
// ══════════════════════════════════════════════════════
window.shayu = {
  api: function (path, opts) { return fetch(PANEL + path, opts); },
  panel: function () { return PANEL; },
  toast: function (t) {
    const d = document.createElement("div");
    d.textContent = t;
    d.style.cssText = "position:fixed;left:50%;bottom:80px;transform:translateX(-50%);z-index:99;" +
      "background:rgba(20,22,38,.92);color:#e6ebff;padding:8px 16px;border-radius:10px;font-size:13px;" +
      "border:1px solid rgba(140,150,255,.28)";
    document.body.appendChild(d);
    setTimeout(function () { d.remove(); }, 2400);
  }
};

function loadPluginUI() {
  fetch(PANEL + "/api/plugins/ui", { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (!d || !d.ok) return;
      var css = "", html = "", js = [];
      (d.plugins || []).forEach(function (p) {
        if (p.css) css += "\n/* " + p.name + " */\n" + p.css;
        if (p.html) html += "\n<!-- " + p.name + " -->\n" + p.html;
        if (p.js) js.push("/* " + p.name + " */\n" + p.js);
      });
      if (css) {
        var st = document.createElement("style");
        st.textContent = css;
        document.head.appendChild(st);
      }
      if (html) {
        var box = document.createElement("div");
        box.id = "plugin-ui-root";
        box.innerHTML = html;
        document.body.appendChild(box);
      }
      js.forEach(function (code) {
        try { new Function("shayu", code)(window.shayu); }
        catch (e) { console.warn("[plugin ui]", e); }
      });
    })
    .catch(function () { /* 面板没起来就不注入 */ });
}
loadPluginUI();

// 主动要一次设置：C# 那边页面还没加载完就推的话会被丢掉，别指望一次成功
post({ cmd: "getSettings" });
load(true);
setTimeout(checkAppVersion, 1800);
</script>
</body>
</html>
