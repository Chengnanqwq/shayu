<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>傻鱼 · 大脑</title>
<style>
  html,body{margin:0;height:100%;background:#05070f;overflow:hidden;
    font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;color:#cfe2ff;
    -webkit-user-select:none;user-select:none}
  canvas{display:block;position:fixed;inset:0;cursor:grab}
  canvas.dragging{cursor:grabbing}
  .hud{position:fixed;pointer-events:none;text-shadow:0 0 12px rgba(90,180,255,.45)}
  #title{left:24px;top:20px;font-size:19px;letter-spacing:3px;color:#eaf6ff}
  #title small{display:block;font-size:11px;letter-spacing:1px;color:#6f8fc4;margin-top:6px}
  #online{display:inline-block;width:7px;height:7px;border-radius:50%;background:#4fe08a;
    box-shadow:0 0 10px #4fe08a;margin-right:7px;vertical-align:middle}
  #online.off{background:#ff5c6c;box-shadow:0 0 10px #ff5c6c}
  #stats{right:24px;top:20px;text-align:right;font-size:12px;color:#7fa3d8;line-height:1.9}
  #stats b{color:#dff0ff;font-weight:600}
  #legend{left:24px;bottom:22px;font-size:12px;line-height:1.9;color:#8fb0e0;max-width:736px;display:flex;flex-wrap:wrap}
  #legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;
    vertical-align:middle;box-shadow:0 0 8px currentColor}
  #hint{right:24px;bottom:22px;font-size:11px;color:#4f6c96;text-align:right;line-height:1.8}
  /* 新装的时候脑里几乎没东西，别让一堆空星系名和图例挤成一团 */
  #empty{position:fixed;left:50%;top:60%;transform:translate(-50%,-50%);text-align:center;
    font-size:13px;color:#9dbbdd;line-height:2.1;pointer-events:none;display:none;z-index:6;
    letter-spacing:.5px;text-shadow:0 0 12px rgba(8,12,24,.9)}
  #empty small{font-size:11px;color:#5c7aa8}
  #toggle{pointer-events:auto;font-size:12px;color:#8fb0e0;
    background:rgba(20,32,60,.55);border:1px solid #22355e;border-radius:14px;padding:5px 12px;
    cursor:pointer;backdrop-filter:blur(4px)}
  #toggle:hover{border-color:#3c5c96;color:#dff0ff}
  #card{position:fixed;right:-360px;top:90px;width:300px;padding:16px 18px;border-radius:12px;
    background:linear-gradient(160deg,rgba(16,26,48,.94),rgba(9,14,28,.94));
    border:1px solid #22355e;box-shadow:0 10px 40px rgba(0,0,0,.55),0 0 30px rgba(60,140,255,.12);
    transition:right .28s ease;font-size:12px;line-height:1.8;backdrop-filter:blur(8px)}
  #card.on{right:20px}
  #card h3{margin:0 0 10px;font-size:13px;color:#eaf6ff;letter-spacing:1px;font-weight:600}
  #card .tag{display:inline-block;padding:1px 8px;border-radius:9px;font-size:11px;
    border:1px solid currentColor;margin-right:6px}
  #card p{margin:8px 0;color:#9fbedf}
  #card b{color:#dff0ff}
  #card .bar{height:4px;border-radius:3px;background:#16233f;margin:5px 0 9px;overflow:hidden}
  #card .bar i{display:block;height:100%;border-radius:3px;
    background:linear-gradient(90deg,#3c78ff,#6fe0ff);box-shadow:0 0 10px #4fa8ff}
  #card .close{position:absolute;right:12px;top:10px;color:#5c7aa8;cursor:pointer;font-size:14px}
  #card .close:hover{color:#dff0ff}
  #tip{position:fixed;pointer-events:none;padding:6px 10px;border-radius:8px;font-size:12px;
    background:rgba(10,18,34,.92);border:1px solid #29406b;color:#cfe2ff;display:none;
    max-width:280px;line-height:1.6;box-shadow:0 6px 24px rgba(0,0,0,.5)}
  #tip small{color:#6f8fc4}

  /* 左侧按钮的反馈 */
  #leftpanel button.tap{animation:tapPulse .32s ease-out}
  @keyframes tapPulse{0%{box-shadow:0 0 0 0 rgba(120,200,255,.55)}100%{box-shadow:0 0 0 14px rgba(120,200,255,0)}}

  /* ===== 科技感按钮（切角 + 细光边 + 状态灯） ===== */
  .tbtn{position:relative;pointer-events:auto;font-family:inherit;font-size:11px;line-height:1.35;
    color:#8fd4ff;letter-spacing:.3px;padding:5px 10px;cursor:pointer;
    border:1px solid rgba(86,170,255,.34);
    background:linear-gradient(180deg,rgba(18,46,78,.72),rgba(7,17,32,.86));
    clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
    box-shadow:inset 0 0 10px rgba(60,170,255,.10);
    transition:color .16s,border-color .16s,box-shadow .16s,background .16s,transform .07s}
  .tbtn::before,.tbtn::after{content:"";position:absolute;height:1px;width:14px;pointer-events:none}
  .tbtn::before{left:2px;top:0;background:linear-gradient(90deg,rgba(120,240,255,.9),rgba(120,240,255,0))}
  .tbtn::after{right:2px;bottom:0;background:linear-gradient(270deg,rgba(120,240,255,.9),rgba(120,240,255,0))}
  .tbtn:hover{color:#eafbff;border-color:rgba(120,225,255,.8);
    background:linear-gradient(90deg,rgba(120,230,255,0) 0%,rgba(120,230,255,.16) 45%,rgba(120,230,255,0) 90%) no-repeat,
               linear-gradient(180deg,rgba(26,70,112,.8),rgba(9,24,44,.9));
    background-size:220% 100%,100% 100%;
    background-position:-120% 0,0 0;
    animation:btnSweep .8s ease-out forwards;
    box-shadow:inset 0 0 14px rgba(90,200,255,.22),0 0 12px rgba(70,190,255,.30)}
  @keyframes btnSweep{from{background-position:-120% 0,0 0}to{background-position:120% 0,0 0}}
  #leftpanel > button{align-self:flex-start;width:auto}
  .tbtn:active{transform:translateY(1px) scale(.985)}
  .tbtn.on{color:#eafcff;border-color:#5fe3ff;
    background:linear-gradient(180deg,rgba(28,86,124,.82),rgba(8,32,56,.9));
    box-shadow:inset 0 0 16px rgba(90,220,255,.28),0 0 14px rgba(80,200,255,.32)}
  .tbtn.off{color:#61809f;border-color:rgba(86,140,200,.22);
    background:linear-gradient(180deg,rgba(12,24,42,.7),rgba(6,12,22,.85))}
  .tbtn.off::before,.tbtn.off::after{opacity:.3}
  .tbtn .led{display:inline-block;width:5px;height:5px;border-radius:50%;margin-right:6px;
    background:currentColor;box-shadow:0 0 6px currentColor;vertical-align:middle;opacity:.95}
  .tbtn.off .led{opacity:.35;box-shadow:none}

  /* 图例小胶囊 */
  .chip{pointer-events:auto;cursor:pointer;display:inline-flex;align-items:center;gap:5px;font-size:10.5px;
    padding:1px 8px;line-height:16px;border:1px solid rgba(86,170,255,.28);
    background:linear-gradient(180deg,rgba(16,40,68,.7),rgba(7,17,30,.82));
    clip-path:polygon(4px 0,100% 0,100% calc(100% - 4px),calc(100% - 4px) 100%,0 100%,0 4px);
    transition:border-color .15s,box-shadow .15s,background .15s}
  .chip:hover{border-color:rgba(120,225,255,.75);box-shadow:0 0 10px rgba(70,190,255,.25)}
  .chip.on{border-color:#5fe3ff;box-shadow:inset 0 0 10px rgba(90,220,255,.25),0 0 10px rgba(80,200,255,.3)}
  .chip i{display:inline-block;width:6px;height:6px;border-radius:50%}
  .legcap{font-size:10.5px;color:#5c7aa8;line-height:16px;letter-spacing:1px;opacity:.85}
  #segrange{accent-color:#4fd6ff}
#fx-vig{position:fixed;inset:0;pointer-events:none;z-index:7;box-shadow:inset 0 0 260px rgba(0,0,0,.88)}
#fx-scan{display:none}
.fx-corner{display:none}
#zoomctl{position:fixed;right:26px;bottom:150px;z-index:9;display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:auto}
#zoomctl button{position:relative;width:38px;height:38px;border-radius:50%;border:1px solid rgba(110,220,255,.34);
  background:radial-gradient(circle at 50% 32%,rgba(22,64,102,.78),rgba(6,16,30,.92));color:#8fe3ff;
  font-size:16px;line-height:1;cursor:pointer;backdrop-filter:blur(6px);
  box-shadow:inset 0 0 12px rgba(60,170,255,.16);
  transition:border-color .15s,color .15s,box-shadow .15s}
#zoomctl button::after{content:"";position:absolute;inset:-4px;border-radius:50%;
  border:1px dashed rgba(110,220,255,.26);opacity:.45;transition:opacity .2s,transform .3s;pointer-events:none}
#zoomctl button:hover{border-color:#6fe0ff;color:#eafdff;
  box-shadow:inset 0 0 16px rgba(90,210,255,.3),0 0 18px rgba(80,200,255,.35)}
#zoomctl button:hover::after{opacity:1;transform:rotate(45deg)}
#zval{font-size:10px;color:#6f9ccc;letter-spacing:1.5px;font-variant-numeric:tabular-nums}
/* 隐藏 HUD：只看星系（按 H，或点顶部中间那个常驻小按钮） */
.hud,#leftpanel,#zoomctl{transition:opacity .22s ease}
body.hudoff .hud,body.hudoff #leftpanel,body.hudoff #zoomctl{opacity:0!important;pointer-events:none!important}
#hudbtn{position:fixed;left:50%;transform:translateX(-50%);top:10px;z-index:21;opacity:.45;font-size:10.5px;
  padding:3px 12px;letter-spacing:1px}
#hudbtn:hover{opacity:1}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="hudbtn" class="tbtn" title="隐藏 / 显示界面 (H)">隐藏界面</button>
<div id="fx-vig"></div>
<div id="fx-scan"></div>
<div class="fx-corner" id="fx-c1"></div><div class="fx-corner" id="fx-c2"></div>
<div class="fx-corner" id="fx-c3"></div><div class="fx-corner" id="fx-c4"></div>
<div id="zoomctl">
  <button id="zin" title="放大 (+)">＋</button>
  <div id="zval">100%</div>
  <button id="zout" title="缩小 (-)">－</button>
  <button id="zreset" title="复位 (0)">⟲</button>
</div>
<div class="hud" id="title"><span id="online"></span>傻鱼 · 记忆宇宙<small>memory universe · dyson core</small></div>
<div id="leftpanel" style="position:fixed;left:24px;top:76px;display:flex;flex-direction:column;gap:7px;max-width:330px">
  <div style="display:flex;gap:6px;align-items:center">
    <button id="toggle" class="tbtn on"><i class="led"></i>记忆层：开</button>
    <button id="fold" class="tbtn on" title="收起 / 展开这些开关（快捷键 C）" style="padding:5px 9px">收起 ▴</button>
  </div>
  <div id="lpbody" style="display:flex;flex-direction:column;gap:7px">
  <div id="switches" style="display:flex;gap:6px;flex-wrap:wrap"></div>
  <div id="actions" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px"></div>
  <div id="views" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px"></div>
    <div id="layers" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px"></div>
  <div style="display:flex;align-items:center;gap:8px;font-size:11px;color:#8fb0e0;margin-top:2px">
    <span>每段字数 <b id="segnum" style="color:#dff0ff">30</b></span>
    <input id="segrange" type="range" min="10" max="80" step="5" value="30" style="flex:1">
  </div>
  </div>
</div>
<div class="hud" id="stats"></div>
<div class="hud" id="legend"></div>
<div class="hud" id="hint">中间那层网格是戴森球，裹着她的本体 · 一类记忆一个星系 · 点星系核或名字放大 · 点空白还原<br>拖拽 360° 旋转（上下到 ±88° 为止，不会翻个底朝天）· 方向键也行 · 滚轮缩放 · <b>H</b> 隐藏界面</div>
<div id="card"><span class="close">×</span><div id="cardbody"></div></div>
<div id="empty">还没有什么记忆<br><small>让她和你多聊几句，这里就会长出星系来</small></div>
<div class="hud" id="models" style="right:24px;top:96px;text-align:right;font-size:11px;color:#6f8fc4;line-height:1.9"></div>
<div id="tip"></div>

<script>
"use strict";
/* ========== 基础 ========== */
var cv = document.getElementById("c"), ctx = cv.getContext("2d");

/* ===== 左上开关面板：收起 / 展开（记住上次状态） ===== */
(function () {
  var btn = document.getElementById("fold");
  var body = document.getElementById("lpbody");
  if (!btn || !body) return;
  function apply(folded) {
    body.style.display = folded ? "none" : "flex";
    btn.textContent = folded ? "展开 ▾" : "收起 ▴";
    btn.classList.toggle("on", !folded);
    try { localStorage.setItem("shayu_lp_folded", folded ? "1" : "0"); } catch (e) {}
  }
  var folded = false;
  try { folded = localStorage.getItem("shayu_lp_folded") === "1"; } catch (e) {}
  apply(folded);
  btn.addEventListener("click", function (e) {
    e.stopPropagation();
    folded = body.style.display !== "none";
    apply(folded);
  });
  window._toggleLeftPanel = function () { folded = body.style.display !== "none"; apply(folded); };
})();

var W = 0, H = 0, DPR = 1, cx = 0, cy = 0;
var COLORS = {
  // BRAIN_COLORS_1105：按色相环均匀铺开，相邻类别至少差 25°
  person:    "#FF3B5C",  // 人物   正红
  empathy:   "#FF6FB5",  // 别人的情绪 洋红
  quote:     "#C238FF",  // 金句   紫红
  feeling:   "#8A5CFF",  // 情绪   紫
  skill:     "#3D7DFF",  // 技能   蓝
  fact:      "#00D4FF",  // 事实   青
  meme:      "#00E59B",  // 梗     翠绿
  object:    "#7ED957",  // 实物   草绿
  event:     "#FFC53D",  // 事件   琥珀
  agreement: "#FFF066",  // 约定   亮黄
  visual:    "#FF8A3D",  // 视觉   橙
  work:      "#8FA0B8"   // 短期   灰蓝
};
var LABELS = {
  person: "人物", object: "实物", skill: "技能", fact: "事实",
  event: "事件", agreement: "约定", feeling: "情绪", visual: "视觉", work: "短期", meme: "梗", quote: "金句", empathy: "别人的情绪"
};
var G = { nodes: [], edges: [], regions: [], core: null, stats: {}, now: 0 };
var cam = { yaw: 0.60, pitch: -0.78, roll: 0, dist: 20.0, vel: 0, dragging: false,
            tx: 0, ty: 0, tz: 0, target: null };
var hover = null, selected = null, showMemory = true, online = false, focusKind = null, focusLayer = null;
var sprites = {}, coreSprite = null, adjacency = {};
var lastT = 0, tNow = 0;
var SPIN_HOLD = 0;   // 手动拖过之后，自动旋转先停一会儿

function rgb(hex) {
  var h = (hex || "#6f8fc4").replace("#", "");
  if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  var n = parseInt(h, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function mkSprite(color) {
  var s = document.createElement("canvas"); s.width = s.height = 64;
  var g = s.getContext("2d"), rg = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  rg.addColorStop(0, "rgba(255,255,255,.98)");
  rg.addColorStop(0.16, color);
  rg.addColorStop(0.42, color.replace("rgb", "rgba").replace(")", ",.42)"));
  rg.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = rg; g.beginPath(); g.arc(32, 32, 32, 0, 6.2832); g.fill();
  return s;
}
function css(c, a) { return "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + a + ")"; }

/* ========== 几何 ========== */
var _projFrame = 0;
var PF = 1;                       // 投影焦距（只在 resize 时算一次）
var VIEW_DX = 0, VIEW_DY = 0;     // 画面整体偏移：左边有面板、下面有图例，别让星系钻到后面
var HUD_ON = true;                // 隐藏 HUD = 只看星系（按 H 切换）
var _T = { yaw: 1e9, pitch: 1e9, cy: 1, sy: 0, cp: 1, sp: 0 };
function _updT() {
  if (_T.yaw !== cam.yaw || _T.pitch !== cam.pitch) {
    _T.yaw = cam.yaw; _T.pitch = cam.pitch;
    _T.cy = Math.cos(cam.yaw); _T.sy = Math.sin(cam.yaw);
    _T.cp = Math.cos(cam.pitch); _T.sp = Math.sin(cam.pitch);
  }
}
function project(p) {
  if (p && p.id && p.__pf === _projFrame && p.__pp) return p.__pp;
  _updT();
  var x1 = (p.x - cam.tx) * _T.cy - (p.z - cam.tz) * _T.sy;
  var z1 = (p.x - cam.tx) * _T.sy + (p.z - cam.tz) * _T.cy;
  var y1 = (p.y - cam.ty) * _T.cp - z1 * _T.sp;
  var z2 = (p.y - cam.ty) * _T.sp + z1 * _T.cp;
  var depth = cam.dist - z2;
  if (depth < 0.25) depth = 0.25;
  var s = 1.55 / depth;
  var F = PF;
  // 过头顶/脚底时靠 roll 把画面转回来，越过极点才不会“啪”地翻 180°
  if (cam.roll) {
    var _cr = Math.cos(cam.roll), _sr = Math.sin(cam.roll);
    var _rx = x1 * _cr - y1 * _sr, _ry = x1 * _sr + y1 * _cr;
    x1 = _rx; y1 = _ry;
  }
  var _res = { sx: cx + VIEW_DX + x1 * s * F, sy: cy + VIEW_DY + y1 * s * F, s: s, d: depth, z: z2 };
  if (p && p.id) { p.__pf = _projFrame; p.__pp = _res; }
  return _res;
}

/* ========== 数据 ========== */
function demo() {
  var kinds = Object.keys(COLORS), nodes = [], edges = [], regions = [];
  var anchors = {
    person: [-0.52,0.16,0.10], fact: [-0.10,0.56,-0.16], event: [0.46,0.04,0.10],
    feeling: [-0.04,-0.42,0.28], agreement: [0.36,0.52,-0.08], skill: [-0.44,-0.34,-0.24],
    visual: [-0.66,-0.12,-0.16], work: [0.04,0.02,0.52], object: [0.62,-0.30,-0.12]
  ,
    meme: [0.62, 0.34, 0.30],
    quote: [-0.62, 0.30, 0.38],
    empathy: [0.10, -0.55, 0.62]
  };
  var texts = {
    person: [],
    fact: ["白米饭、打游戏", "周五前交稿", "住在杭州", "喜欢蓝色"],
    event: ["昨天群里吵架", "第一次被夸", "周末一起打游戏"],
    feeling: ["被骂之后不高兴", "被哄了很开心"],
    agreement: ["答应帮他写脚本", "周五前交稿"],
    skill: ["会写 Python", "会搜图", "会发说说"],
    visual: ["蓝头发", "头顶一个盆"],
    work: ["在调机器人", "刚聊到白米饭"],
    object: ["白米饭", "冰可乐", "手机"],
    meme: ["闪身步", "尊嘟假嘟", "棍木", "狗熊哆嗦毛"],
    quote: ["不是记得多，是忘得对", "她会忘了我"],
    empathy: ["他被骂了不太高兴", "她其实在硬撑"]
  };
  kinds.forEach(function (k, ki) {
    var a = anchors[k], n = 4 + (ki % 6);
    for (var i = 0; i < n; i++) {
      var id = "d" + k + i;
      nodes.push({ id: id, k: k, t: texts[k][i % texts[k].length], imp: 0.35 + Math.random() * 0.5,
        hits: (Math.random() * 5) | 0, tier: "mid", act: Math.random() < 0.12 ? Date.now() / 1000 : 0,
        x: a[0] + (Math.random() - 0.5) * 0.34, y: a[1] + (Math.random() - 0.5) * 0.30,
        z: a[2] + (Math.random() - 0.5) * 0.34 });
      if (i) edges.push([id, "d" + k + (i - 1), 0.3 + Math.random() * 0.4]);
    }
    regions.push({ key: k, label: LABELS[k], color: COLORS[k], count: n });
  });
  for (var j = 0; j < 12; j++) {
    var a1 = nodes[(Math.random() * nodes.length) | 0], a2 = nodes[(Math.random() * nodes.length) | 0];
    if (a1 !== a2) edges.push([a1.id, a2.id, 0.2 + Math.random() * 0.3]);
  }
  return { nodes: nodes, edges: edges, regions: regions, now: Date.now() / 1000,
    stats: { nodes: nodes.length, edges: edges.length, adds: 42, sessions: 3 },
    core: { self: "我是傻鱼，一只住在 QQ 里的小鲸鱼。蓝头发，头顶一个盆，嘴硬心软。",
      mood: { v: 0.62, a: 0.31, label: "心情不错" },
      rel: { warmth: 0.82, text: "命根子级别，谁都不能碰" },
      focus: ["在调机器人", "周五要交稿"], grudges: [], turns: 120, act: 0 } };
}

function apply(data) {
  if (!data || !data.nodes) return;
  G.nodes = data.nodes;
  G.edges = data.edges || [];
  G.regions = data.regions || [];
  G.byId = {}; (G.nodes || []).forEach(function (n) { G.byId[n.id] = n; });
  G.regionNodes = {};
  (G.nodes || []).forEach(function (n) { (G.regionNodes[n.k] = G.regionNodes[n.k] || []).push(n); });
  G.core = data.core || G.core;
  G.stats = data.stats || {};
  G.tech = data.tech || G.tech || null;

// 每帧按轨道参数把节点摆回各自的星系里
function updateOrbits(t) {
  var gals = G.galaxies || [];
  for (var i = 0; i < G.nodes.length; i++) {
    var n = G.nodes[i];
    if (!n.orb) continue;
    var g;
    if (n.gal < 0) {
      // 核心卫星：直接贴近原点（核心·傻鱼）的轨道
      g = { center: [0, 0, 0], tilt: [0.42, 0.18] };
    } else {
      g = gals[n.gal || 0] || gals[0];
      if (!g) continue;
    }
    var r = n.orb[0], a0 = n.orb[1], inc = n.orb[2];
    var sp = 0.10 / Math.pow(Math.max(0.12, r), 0.55);
    var a = a0 + t * sp;
    var lx = r * Math.cos(a), lz = r * Math.sin(a);
    var ly = lz * Math.sin(inc), lz2 = lz * Math.cos(inc);
    var ca = Math.cos(g.tilt[0]), sa = Math.sin(g.tilt[0]);
    var y1 = ly * ca - lz2 * sa, z1 = ly * sa + lz2 * ca;
    var cb = Math.cos(g.tilt[1]), sb = Math.sin(g.tilt[1]);
    n.x = g.center[0] + lx * cb + z1 * sb;
    n.y = g.center[1] + y1;
    n.z = g.center[2] - lx * sb + z1 * cb;
  }
}

// BRAIN_LAYOUT_1105：三种记忆展现方式
var LAYOUT = "universe";
var _armOf = {}, _armN = 0;

function applyLayout(t) {
  if (LAYOUT === "universe") return;      // 保持原有的星系公转
  var N = G.nodes.length;
  if (!N) return;

  for (var i = 0; i < N; i++) {
    var n = G.nodes[i];
    var k = n.k || "fact";
    if (_armOf[k] === undefined) { _armOf[k] = _armN % 6; _armN++; }
    var arm = _armOf[k];

    if (LAYOUT === "galaxy") {
      // 螺旋星系：6 条旋臂，沿臂按序铺开，越外越散
      var f = (i * 0.6180339) % 1;                  // 黄金比散布，0..1 均匀且不聚堆
      var th = arm * (6.2832 / 6) + f * 3.2 + t * 0.05 * (arm % 2 ? 1 : -1);
      var r = 1.2 + f * 5.2 + (i % 9) * 0.12;       // 最远约 7.5，明显小于相机距离
      n.x = Math.cos(th) * r;
      n.z = Math.sin(th) * r;
      n.y = Math.sin(th * 2 + arm * 1.3) * 0.35 + ((i % 5) - 2) * 0.10;
    } else {
      // 戴森球：球壳均匀分布（黄金角），按层级分三层半径，整体缓慢自转
      var phi = Math.acos(1 - 2 * ((i + 0.5) / N));
      var gth = 2.399963 * i;
      var R = n.tier === "inner" ? 2.2 : (n.tier === "mid" ? 3.4 : 4.6);
      var x = Math.sin(phi) * Math.cos(gth) * R;
      var y = Math.cos(phi) * R;
      var z = Math.sin(phi) * Math.sin(gth) * R;
      var rot = t * 0.11;
      n.x = x * Math.cos(rot) - z * Math.sin(rot);
      n.z = x * Math.sin(rot) + z * Math.cos(rot);
      n.y = y;
    }
  }
}

// BRAIN_DECO_1105：装饰光点（只为质感，不参与交互）
var DECO = [];

function buildDeco() {
  DECO = [];
  if (LAYOUT === "universe") return;
  var kinds = ["person", "object", "skill", "fact", "event",
               "agreement", "feeling", "meme", "quote", "empathy", "visual"];
  var N = LAYOUT === "galaxy" ? 1800 : 2200;
  for (var i = 0; i < N; i++) {
    var c = kinds[i % kinds.length];
    if (LAYOUT === "galaxy") {
      var arm = i % 6;
      var f = Math.pow((i % 300) / 300, 0.62);          // 越靠外越稀
      var th = arm * (6.2832 / 6) + f * 4.0 + (Math.random() - 0.5) * 0.55;
      var r = 0.7 + f * 6.6 + (Math.random() - 0.5) * 0.8;
      DECO.push({ x: Math.cos(th) * r, y: (Math.random() - 0.5) * 0.45,
                  z: Math.sin(th) * r, c: c, a: 0.10 + Math.random() * 0.24 });
    } else {
      var phi = Math.acos(1 - 2 * ((i + 0.5) / N));
      var gth = 2.399963 * i;
      var R = 2.9 + Math.random() * 2.3;
      DECO.push({ x: Math.sin(phi) * Math.cos(gth) * R, y: Math.cos(phi) * R,
                  z: Math.sin(phi) * Math.sin(gth) * R, c: c,
                  a: 0.08 + Math.random() * 0.20 });
    }
  }
}

function drawDeco() {
  if (!DECO.length) return;
  var rot = (LAYOUT === "dyson") ? tNow * 0.11 : 0;
  var cr = Math.cos(rot), sr = Math.sin(rot);
  ctx.globalCompositeOperation = "lighter";
  for (var i = 0; i < DECO.length; i++) {
    var d = DECO[i], x = d.x, z = d.z;
    if (rot) { var x2 = x * cr - z * sr; z = x * sr + z * cr; x = x2; }
    var p = project({ x: x, y: d.y, z: z });
    if (p.sx < -60 || p.sx > W + 60 || p.sy < -60 || p.sy > H + 60) continue;
    var cc = rgb(COLORS[d.c] || "#8fb0e0");
    ctx.fillStyle = "rgba(" + cc[0] + "," + cc[1] + "," + cc[2] + "," + d.a.toFixed(2) + ")";
    var sz = d.a > 0.22 ? 2 : 1;
    ctx.fillRect(p.sx, p.sy, sz, sz);
  }
  ctx.globalAlpha = 1;
}

// 星系平面 → 世界坐标（和 updateOrbits 同一套变换，dust / 环线都靠它）
function galaxyPoint(g, r, th, inc) {
  var lx = r * Math.cos(th), lz = r * Math.sin(th);
  var ly = lz * Math.sin(inc || 0), lz2 = lz * Math.cos(inc || 0);
  var ca = Math.cos(g.tilt[0]), sa = Math.sin(g.tilt[0]);
  var y1 = ly * ca - lz2 * sa, z1 = ly * sa + lz2 * ca;
  var cb = Math.cos(g.tilt[1]), sb = Math.sin(g.tilt[1]);
  return { x: g.center[0] + lx * cb + z1 * sb,
           y: g.center[1] + y1,
           z: g.center[2] - lx * sb + z1 * cb };
}

// 旋臂星尘：两条对数螺线 + 几团亮斑；只建一次，之后每帧只改角度
function galaxyDust(g, gi, cnt) {
  if (g._dust) return g._dust;
  var sd = 1000 + gi * 7717;
  var rr = function () { sd = (sd * 1103515245 + 12345) & 0x7fffffff; return sd / 0x7fffffff; };
  var size = g.size || 1;
  var per = Math.max(34, Math.min(140, Math.round(24 + (cnt || 40) * 0.8)));
  var air = [];
  for (var arm = 0; arm < 2; arm++) {
    for (var i = 0; i < per; i++) {
      var u = Math.pow(rr(), 0.5);
      var r = (0.14 + 0.92 * u) * size;
      var th = arm * Math.PI + Math.log(r / size / 0.16 + 1e-4) * 1.25
             + (rr() - 0.5) * (0.30 + 0.50 * (1 - u));
      air.push({ r: r, th: th, inc: (rr() - 0.5) * 0.14, sz: 0.65 + rr() * 0.85,
                 sp: 0.8 + rr() * 0.4, glow: 0 });
    }
  }
  for (var c = 0; c < 8; c++) {
    var r2 = (0.24 + 0.72 * rr()) * size;
    var th2 = (rr() < 0.5 ? 0 : Math.PI) + Math.log(r2 / size / 0.16 + 1e-4) * 1.25
            + (rr() - 0.5) * 0.22;
    air.push({ r: r2, th: th2, inc: (rr() - 0.5) * 0.08, sz: 2.2 + rr() * 2.2, sp: 1, glow: 1 });
  }
  g._dust = air;
  return air;
}

// HUD 占的地方（星系名要绕开）；HUD 隐藏时不用绕
function hudBlocks() {

}
function rectOverlap(a, b, m) {
  m = m || 5;
  return a.x < b.x + b.w + m && a.x + a.w + m > b.x &&
         a.y < b.y + b.h + m && a.y + a.h + m > b.y;
}

function drawGalaxies(ctx, ga, t) {
  // 一类记忆一个星系，绕中间的核心转；星系之间用星尘丝连着
  G._labels = [];
  if (ga <= 0.05) return;
  var tt = t || 0;
  var gals = G.galaxies || [];
  if (!gals.length) return;
  var F = PF;
  var c0 = project({ x: 0, y: 0, z: 0 });
  var _fg = (G.focusGalaxy === null || G.focusGalaxy === undefined) ? -1 : G.focusGalaxy;
  var focused = _fg >= 0;
  ctx.globalCompositeOperation = "lighter";

  // 深空星云
  var nebs = [
    { dx: -300, dy: -150, r: 600, c: [110, 60, 200], a: 0.13 },
    { dx: 360, dy: 170, r: 560, c: [40, 110, 200], a: 0.10 },
    { dx: 120, dy: -310, r: 460, c: [190, 70, 160], a: 0.06 }
  ];
  nebs.forEach(function (nb, k) {
    var drift = Math.sin(tt * 0.04 + k) * 18;
    var g2 = ctx.createRadialGradient(c0.sx + nb.dx + drift, c0.sy + nb.dy, 0,
      c0.sx + nb.dx + drift, c0.sy + nb.dy, nb.r);
    g2.addColorStop(0, "rgba(" + nb.c[0] + "," + nb.c[1] + "," + nb.c[2] + "," +
      (nb.a * ga * (focused ? 0.45 : 1)) + ")");
    g2.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = g2;
    ctx.beginPath(); ctx.arc(c0.sx + nb.dx + drift, c0.sy + nb.dy, nb.r, 0, 6.2832); ctx.fill();
  });

  var labels = [];
  var blocks = hudBlocks();
  var spin = tt * 0.011;

  gals.forEach(function (g, gi) {
    var isSel = (gi === _fg);
    var dim = focused ? (isSel ? 1 : 0.13) : 1;
    var p0 = project({ x: g.center[0], y: g.center[1], z: g.center[2] });
    var s = p0.s || 0.1;
    var size = g.size || 1;
    var rad = size * s * F * 1.06;              // 星系在屏幕上的半径（= 最外层轨道）
    var col = g.color || [150, 170, 255];
    var cc = col[0] + "," + col[1] + "," + col[2];
    var vis = Math.max(0, Math.min(1, (rad - 8) / 34)) * dim;

function drawMeteors(t) {

  while (METEORS.length < METEOR_MAX) METEORS.push(_spawnMeteor(t - Math.random() * 2.2));

  for (i = 0; i < METEORS.length; i++) {
    m = METEORS[i];
    var k = (t - m.born) / m.life;
    if (k < 0 || k > 1) continue;

function wrapText(text, x, y, maxW, lh) {
  var line = "", lines = [];
  for (var i = 0; i < text.length; i++) {
    var test = line + text[i];
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = text[i]; }
    else line = test;
  }
  if (line) lines.push(line);
  lines.slice(0, 4).forEach(function (l, i) { ctx.fillText(l, x, y + i * lh); });
}

function nodeById(id) {
  if (G.byId) return G.byId[id] || null;

/* ========== 零食投喂：一点饼干飞向核心，到了就撒一把渣 ========== */
var SNACK = { fly: [], crumbs: [], toast: null, pulse: 0 };

function coreScreen() {
  var p = project({ x: 0, y: 0, z: 0 });

function feedSnack(ev) {
  var bx = W * 0.09, by = H * 0.34;
  if (ev && ev.target && ev.target.getBoundingClientRect) {

  }).then(function (r) { return r.json(); }).then(function (d) {

    if (d && d.ok === false) txt = d.error || "喂不进去";
    else if (d) {

  }).catch(function () {

function drawCookie(x, y, r, rot) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.globalCompositeOperation = "source-over";
  var g = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
  g.addColorStop(0, "#f7dcaa");
  g.addColorStop(0.72, "#d8a765");
  g.addColorStop(1, "#a97a3f");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.2832); ctx.fill();
  ctx.fillStyle = "rgba(92,56,26,.9)";
  var chips = [[-0.32, -0.20], [0.26, -0.34], [0.10, 0.24], [-0.30, 0.34]];
  for (var i = 0; i < chips.length; i++) {
    ctx.beginPath();
    ctx.arc(chips[i][0] * r, chips[i][1] * r, r * 0.15, 0, 6.2832);
    ctx.fill();
  }
  ctx.restore();
}

function drawSnackFX(dt) {
  var i, f, c, a;
  var d = Math.max(0.001, Math.min(0.05, dt || 0.016));
  // 飞向核心的饼干
  for (i = SNACK.fly.length - 1; i >= 0; i--) {
    f = SNACK.fly[i];
    f.t += d;
    var k = Math.min(1, f.t / f.dur);
    var cs = coreScreen();
    var e = k * k * (3 - 2 * k);
    var mx = (f.x0 + cs.x) / 2 + 40, my = Math.min(f.y0, cs.y) - 90;
    var x = (1 - e) * (1 - e) * f.x0 + 2 * (1 - e) * e * mx + e * e * cs.x;
    var y = (1 - e) * (1 - e) * f.y0 + 2 * (1 - e) * e * my + e * e * cs.y;
    var r = 9 + 4 * Math.sin(k * Math.PI);
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = 0.45;
    ctx.fillStyle = "rgba(255,212,150,.5)";
    ctx.beginPath(); ctx.arc(x, y + 9, r * 0.72, 0, 6.2832); ctx.fill();
    drawCookie(x, y, r, k * 5);
    ctx.globalAlpha = 1;
    if (k >= 1) SNACK.fly.splice(i, 1);
  }
  // 饼干屑
  for (i = SNACK.crumbs.length - 1; i >= 0; i--) {
    c = SNACK.crumbs[i];
    c.t += d;
    c.x += c.vx * d;
    c.y += c.vy * d;
    c.vy += 70 * d;
    c.vx *= (1 - 1.2 * d);
    a = 1 - c.t / c.life;
    if (a <= 0) { SNACK.crumbs.splice(i, 1); continue; }
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = a * 0.7;
    ctx.fillStyle = "#ffcf8f";
    ctx.beginPath(); ctx.arc(c.x, c.y, c.sz, 0, 6.2832); ctx.fill();
  }
  // 提示字
  if (SNACK.toast) {
    var age = tNow - SNACK.toast.t;
    if (age > 3.4) SNACK.toast = null;
    else {
      a = Math.min(1, age * 5) * Math.min(1, Math.max(0, (3.4 - age) / 0.9));
      ctx.globalCompositeOperation = "source-over";
      ctx.globalAlpha = Math.max(0, Math.min(1, a));
      ctx.font = "600 12px 'Microsoft YaHei',sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      var ty = SNACK.toast.y - Math.min(26, age * 15);
      var w0 = ctx.measureText(SNACK.toast.text).width;
      ctx.fillStyle = "rgba(8,14,26,.74)";
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(SNACK.toast.x - w0 / 2 - 9, ty - 11, w0 + 18, 22, 11);
      else ctx.rect(SNACK.toast.x - w0 / 2 - 9, ty - 11, w0 + 18, 22);
      ctx.fill();
      ctx.fillStyle = "#ffe6c4";
      ctx.fillText(SNACK.toast.text, SNACK.toast.x, ty);
      ctx.globalAlpha = 1;
    }
  }
  ctx.globalCompositeOperation = "lighter";
  if (SNACK.pulse > 0) SNACK.pulse = Math.max(0, SNACK.pulse - d * 1.8);
}

var lastX = 0, lastY = 0, dragMoved = 0;
cv.addEventListener("pointerdown", function (e) {

// 俯仰限在 ±88°：不再翻过极点。
// 以前翻过极点会加 cam.roll = 180°，整幅画面连同文字一起倒过来，那就是“转动有问题”的根源。
var PITCH_MAX = 1.5359;   // 88°
function orbitPitch(dPitch) {
  if (!dPitch) return;
  cam.pitch = Math.max(-PITCH_MAX, Math.min(PITCH_MAX, cam.pitch + dPitch));
}

cv.addEventListener("pointermove", function (e) {
  if (cam.dragging) {
    var dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    dragMoved += Math.abs(dx) + Math.abs(dy);
    cam.yaw += dx * 0.006;
    orbitPitch(dy * 0.004);
    cam.vel = dx * 0.0011;
    return;
  }
  // hover 拾取
  var best = null, bd = 15;
  for (var i = 0; i < G.nodes.length; i++) {
    var n = G.nodes[i], p = project(n);
    var d = Math.hypot(p.sx - e.clientX, p.sy - e.clientY);
    if (d < bd) { bd = d; best = n; }
  }
  hover = best;
  var tip = document.getElementById("tip");
  if (best) { tip.style.left = (e.clientX + 14) + "px"; tip.style.top = (e.clientY + 12) + "px"; }
});

var ZOOM_MIN = 0.45, ZOOM_MAX = 40.0, ZOOM_HOME = 20.0;

}
// 复位：缩放回默认，顺便把翻滚摆正（转晕了按 0 / ⟲）

function galaxyAt(mx, my) {
  if (!G.galaxies) return null;
  var best = null, bd = 1e9;
  G.galaxies.forEach(function (g, gi) {
    var p = project({ x: g.center[0], y: g.center[1], z: g.center[2] });
    var rad = Math.max(24, (g.size || 1) * (p.s || 0.1) * PF * 1.10);
    var d = Math.hypot(p.sx - mx, p.sy - my);
    if (d < rad && d < bd) { bd = d; best = gi; }

}

function focusGalaxy(gi) {
  var g = G.galaxies && G.galaxies[gi];
  if (!g) return;
  G.focusGalaxy = gi;
  VIEW_MODE = "galaxy";
  if (typeof renderViews === "function") renderViews();
  var ext = (g.size || 1) * 1.06;
  var want = Math.max(120, Math.min(W * 0.30, H * 0.40));

function resetGalaxy() {
  G.focusGalaxy = null;

function labelAt(mx, my) {
  if (!G._labels) return null;
  for (var i = 0; i < G._labels.length; i++) {
    var L = G._labels[i];
    if (mx >= L.box.x - 3 && mx <= L.box.x + L.box.w + 3 &&
        my >= L.box.y - 3 && my <= L.box.y + L.box.h + 3) return L;
  }
  return null;
}

function pick(mx, my) {
  var pc = project({ x: 0, y: 0, z: 0 });
  var coreR = Math.min(W, H) * 0.085 * 1.6;
  if (Math.hypot(pc.sx - mx, pc.sy - my) < coreR) { showCore(); return; }
  // 星系名也能点
  var L = labelAt(mx, my);
  if (L) { focusGalaxy(L.gi); return; }
  // 先认星系核：点在核心上就聚焦，不被旁边的节点抢走
  if (G.galaxies) {
    for (var gi = 0; gi < G.galaxies.length; gi++) {
      var g = G.galaxies[gi];
      var pg = project({ x: g.center[0], y: g.center[1], z: g.center[2] });
      if (Math.hypot(pg.sx - mx, pg.sy - my) < 16) { focusGalaxy(gi); return; }
    }
  }
  var best = null, bd = 16;
  for (var i = 0; i < G.nodes.length; i++) {
    var n = G.nodes[i], p = project(n);
    var d = Math.hypot(p.sx - mx, p.sy - my);
    if (d < bd) { bd = d; best = n; }
  }
  if (best) { showNode(best); return; }
  var gi2 = galaxyAt(mx, my);
  if (gi2 !== null && gi2 !== undefined) { focusGalaxy(gi2); return; }
  if (G.focusGalaxy !== null && G.focusGalaxy !== undefined) { resetGalaxy(); return; }
  hideCard();
}

function showNode(n) {
  selected = n;
  var c = COLORS[n.k] || "#8fb0e0";
  var body = document.getElementById("cardbody");
  body.innerHTML =
    "<h3>" + esc(n.t || "") + "</h3>" +
    "<span class='tag' style='color:" + c + "'>" + (LABELS[n.k] || n.k) + "</span>" +
    "<span class='tag' style='color:#6f8fc4'>" + tierName(n.tier) + "</span>" +
    "<p>重要度 <b>" + Math.round((n.imp || 0) * 100) + "%</b></p>" +
    "<div class='bar'><i style='width:" + Math.round((n.imp || 0) * 100) + "%'></i></div>" +
    "<p>被想起 <b>" + (n.hits || 0) + "</b> 次" +
    (n.act ? "<br>最近一次 " + ago(n.act) + "（" + new Date(n.act * 1000).toLocaleTimeString("zh-CN") + "）" : "") + "</p>" +
    (n.s ? "<p>会话 <b>" + esc(n.s) + "</b></p>" : "");
  if (n.k === "person") {
    var nm = String(n.subj || "").trim() || String(n.t || "").split("（")[0].trim();
    var bare = nm.replace(/[（(][^）)]*[）)]/g, "").replace(/\d{5,12}/g, "").trim();
    var _qm = String(n.t || "").match(/\d{5,12}/);
    var nqq = _qm ? _qm[0] : "";
    var mentions = function (s, subj) {
      s = String(s || "");
      var sb = String(subj || "").replace(/[（(][^）)]*[）)]/g, "").replace(/\d{5,12}/g, "").trim();
      // 主语标签就是这个人 → 一定算
      if (sb && bare && sb === bare) return true;
      if (subj && nm && String(subj).slice(0, 24) === nm.slice(0, 24)) return true;
      // 只是顺带提一句（名字出现在很后面）的不算，避免“比主人还精”这种被算进来
      var p1 = bare ? s.indexOf(bare) : -1;
      var p2 = nm ? s.indexOf(nm) : -1;
      var p3 = nqq ? s.indexOf(nqq) : -1;
      var first = 999;
      if (p1 >= 0 && p1 < first) first = p1;
      if (p2 >= 0 && p2 < first) first = p2;
      if (p3 >= 0 && p3 < first) first = p3;
      return first <= 20;
    };
    var rel = [], indirect = 0;
    G.edges.forEach(function (e) {
      var otherId = e[0] === n.id ? e[1] : (e[1] === n.id ? e[0] : null);
      if (!otherId) return;
      var o = G.nodes.filter(function (x) { return x.id === otherId; })[0];
      if (!o || o.k === "person") return;
      if (!mentions(o.t, o.subj)) { indirect++; return; }
      rel.push({ k: o.k, t: o.t, l: LABELS[o.k] || o.k });
    });
    if (rel.length) {
      var lim = parseInt(localStorage.getItem("relLimit") || "12", 10) || 12;
      body.innerHTML +=
        "<p style='margin-top:10px'>直接提到这个人的事：</p>" +
        "<div style='display:flex;align-items:center;gap:8px;font-size:11px;color:#7fa3d8'>" +
          "<span>显示 <b id='reln'>" + lim + "</b> 条</span>" +
          "<input id='relslider' type='range' min='4' max='40' step='2' value='" + lim + "' style='flex:1'>" +
        "</div>" +
        "<div id='rellist' style='font-size:12px;line-height:1.7;color:#b9cdeb;max-height:42vh;overflow:auto;margin-top:6px'></div>";
      var drawRel = function () {
        var v = parseInt(document.getElementById("relslider").value, 10) || 12;
        document.getElementById("reln").textContent = v;
        var evs = rel.filter(function (x) { return x.k === "event"; });
        var oth = rel.filter(function (x) { return x.k !== "event"; });
        var html = "";
        if (evs.length) {
          html += "<div style='color:#4fe08a;margin:2px 0'>事件（" + evs.length + "）</div>" +
            evs.slice(0, v).map(function (x) { return "- " + esc(x.t); }).join("<br>");
        }
        var rest = Math.max(0, v - Math.min(v, evs.length));
        if (oth.length && rest > 0) {
          html += "<div style='color:#7fa3d8;margin:6px 0 2px'>其他（" + oth.length + "）</div>" +
            oth.slice(0, rest).map(function (x) { return "- [" + x.l + "] " + esc(x.t); }).join("<br>");
        }
        document.getElementById("rellist").innerHTML = html || "…";
      };
      document.getElementById("relslider").oninput = function () {
        localStorage.setItem("relLimit", this.value);
        drawRel();
      };
      drawRel();
    } else {
      body.innerHTML += "<p style='color:#5c7aa8;font-size:12px'>没有直接提到这个人的事" +
        (indirect ? "（另外 " + indirect + " 条只是相似度连线，不算和这个人有关）" : "") + "。</p>";
    }
  }
  document.getElementById("card").classList.add("on");
}

function spiritText(core) {
  return typeof core.spirit === "number" ? Math.round(core.spirit) + "/100" : "—";
}
function spiritBar(core) {
  if (typeof core.spirit !== "number") return "";
  var v = Math.max(0, Math.min(100, Math.round(core.spirit)));
  return "<div class='bar'><i style='width:" + v +
    "%;background:linear-gradient(90deg,#2f6bff,#7ef0ff)'></i></div>";
}

function showCore() {
  var core = G.core || {};
  var m = core.mood || {}, rel = core.rel || {};
  var body = document.getElementById("cardbody");
  body.innerHTML =
    "<h3>核心 · 傻鱼</h3>" +
    "<p>" + esc(core.self || "（核心还没起来）") + "</p>" +
    "<p>当前状态：<b>" + (core.sleep ? "睡着" : "醒着") + "</b> · QQ " + esc(G.qq_status || "在线") +
      " · 肚子 " + Math.round((core.rice && core.rice.full) || 0) + "% · 精神 " + spiritText(core) +
      " · 疲劳 " + Math.round(core.fatigue || 0) + "%</p>" +
    "<p>心情 <b>" + esc(m.label || "—") + "</b></p>" +
    "<div class='bar'><i style='width:" + Math.round((m.v || 0.5) * 100) + "%'></i></div>" +
    "<p>精神 <b>" + spiritText(core) + "</b>" + (core.spirit_label ? " · " + esc(core.spirit_label) : "") + "</p>" +
    spiritBar(core) +
    (function(){ var e = core.emotions || {}; var names = {joy:"开心",anger:"生气",sadness:"难过",gratitude:"感激",fear:"害怕",hope:"期待",hurt:"委屈",pride:"得意"};
      var arr = Object.keys(names).map(function(k){return [names[k], e[k]||0]}).filter(function(x){return x[1]>=5})
        .sort(function(a,b){return b[1]-a[1]}).slice(0,3);
      return arr.length ? "<p>情绪 " + arr.map(function(x){return "<b>" + x[0] + "</b> " + Math.round(x[1])}).join(" · ") + "</p>" : ""; })() +
    "<p>疲劳 <b>" + Math.round(core.fatigue || 0) + "%</b>" + ((core.fatigue || 0) >= 70 ? " · 快睡着了" : "") + "</p>" +
    "<div class='bar'><i style='width:" + Math.round(core.fatigue || 0) + "%;background:linear-gradient(90deg,#ffb84e,#ff6b6b)'></i></div>" +
    "<p>对主人 <b>" + Math.round((rel.warmth || 0) * 100) + "%</b> · " + esc(rel.text || "") + "</p>" +
    (core.traits ? "<p>性格：" + esc(core.traits.join("、")) + "</p>" : "") +
    (core.focus && core.focus.length ? "<p>心上挂着：" + esc(core.focus.join("；")) + "</p>" : "") +
    (core.grudges && core.grudges.length ? "<p style='color:#ff92a8'>还没消气：" + esc(core.grudges.join("；")) + "</p>" : "") +
    "<p>白米饭 <b>" + ((core.rice && core.rice.bowls) || 0) + "</b> 碗 · 肚子 <b>" +
      Math.round((core.rice && core.rice.full) || 0) + "%</b> · " +
      (core.sleep ? "<span style='color:#8fb0ff'>睡着中</span>" : "醒着") + "</p>" +
    "<p>聊过 <b>" + (core.turns || 0) + "</b> 轮 · 画像重写 <b>" + (core.mirror || 0) + "</b> 次</p>";
  document.getElementById("card").classList.add("on");
}

function tierName(t) {
  return t === "long" ? "长期" : t === "short" ? "短期" : "中期";
}

function hideCard() {
  selected = null;
  document.getElementById("card").classList.remove("on");
}
document.querySelector("#card .close").addEventListener("click", hideCard);
window.addEventListener("keydown", function (e) {
  if (e.key === "Escape") {
    hideCard();
    if (G.focusGalaxy !== null && G.focusGalaxy !== undefined) resetGalaxy();
  }
});

var memoOn = true;
document.getElementById("toggle").addEventListener("click", function () {
  memoOn = showMemory = !showMemory;
  this.className = "tbtn " + (showMemory ? "on" : "off");
  this.innerHTML = "<i class='led'></i>记忆层：" + (showMemory ? "开" : "关");
});

/* ========== 数据轮询 ========== */
function fetchData() {
  var ctrl = new AbortController();
  var timer = setTimeout(function () { ctrl.abort(); }, 3500);
  fetch("/api/brain", { signal: ctrl.signal, cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (d) { clearTimeout(timer); online = true; apply(d); })
    .catch(function () { clearTimeout(timer); online = false; renderHUD(); });
}

/* ========== 启动 ========== */
resize();
apply(demo());
setHud(localStorage.getItem("hudOn") !== "0", { save: false });
requestAnimationFrame(draw);
fetchData();
setInterval(fetchData, 4000);
document.addEventListener("visibilitychange", function () {
  if (!document.hidden) fetchData();
});
</script>
</body>
</html>
